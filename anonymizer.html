<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anonymizer 去識別化工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z' fill='%230969da'/%3E%3Crect x='7' y='10' width='10' height='3' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #656d76;
    --border: #d0d7de; --accent: #0969da; --accent-weak: #ddf4ff; --ok: #1a7f37; --warn: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a0;
      --border: #30363d; --accent: #4493f8; --accent-weak: #102a4c; --ok: #3fb950; --warn: #d29922; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
  .title { display: flex; align-items: center; gap: 10px; }
  .title .logo { width: 30px; height: 30px; color: var(--accent); }
  h1 { font-size: 1.35rem; margin: 0; }
  .sub { color: var(--muted); margin: 4px 0 16px; font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 14px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 22px; }
  .opts fieldset { border: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
  .opts legend { font-weight: 600; margin-bottom: 4px; font-size: .9rem; display: flex; align-items: center; gap: 6px; }
  .opts .full { grid-column: 1 / -1; }
  label { font-size: .9rem; cursor: pointer; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; flex-wrap: wrap; }
  .panel-head h2 { font-size: 1rem; margin: 0; display: flex; align-items: center; gap: 6px; }
  textarea, input[type=text], select { font-family: Consolas, "Cascadia Code", monospace;
    font-size: .85rem; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  textarea, input[type=text] { width: 100%; }
  textarea { min-height: 260px; resize: vertical; }
  textarea[readonly] { background: var(--card); }
  select { padding: 4px 8px; font-family: inherit; }
  button { font: inherit; font-size: .85rem; padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; }
  .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .stat { font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .toast { color: var(--ok); font-size: .85rem; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); word-break: break-all; vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; }
  td.mono, .maptable td { font-family: Consolas, monospace; }
  .maptable { max-height: 260px; overflow: auto; }
  details summary { cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .hint { font-size: .8rem; color: var(--muted); }
  .drop { border: 2px dashed var(--border); border-radius: 10px; padding: 22px; text-align: center;
    color: var(--muted); cursor: pointer; transition: .15s; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .drop .ic { width: 28px; height: 28px; }
  .drop.over { border-color: var(--accent); background: var(--accent-weak); color: var(--text); }
  .warn { color: var(--warn); }
  .filetable { margin-top: 10px; }
  .filetable button { padding: 3px 8px; }
</style>
</head>
<body>
<!-- 圖示（SVG symbols） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/><path d="M8 11.5h8"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></symbol>
  <symbol id="i-merge" viewBox="0 0 24 24"><path d="M6 3v6a6 6 0 0 0 6 6h6"/><path d="M15 12l3 3-3 3"/><path d="M6 21v-4"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></symbol>
  <symbol id="i-input" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
</svg>

<div class="wrap">
  <div class="title">
    <svg class="ic logo"><use href="#i-shield"/></svg>
    <h1>Anonymizer 去識別化工具</h1>
  </div>
  <p class="sub">把文字或檔案中的路徑、使用者名稱、IP、Email、帳號密碼換成隨機代號，再貼給 AI。全部在瀏覽器本機處理，不會上傳。</p>

  <!-- ① ② 輸入與結果 -->
  <div class="grid">
    <div class="card">
      <div class="panel-head"><h2><svg class="ic"><use href="#i-input"/></svg>① 原始文字</h2>
        <div class="btns">
          <button id="btnSample"><svg class="ic"><use href="#i-spark"/></svg>範例</button>
          <button id="btnClear"><svg class="ic"><use href="#i-trash"/></svg>清除</button>
        </div>
      </div>
      <textarea id="input" placeholder="貼上含有路徑、IP、帳號的文字、錯誤訊息、log…"></textarea>
    </div>
    <div class="card">
      <div class="panel-head"><h2><svg class="ic"><use href="#i-shield"/></svg>② 去識別化結果</h2>
        <div class="btns"><span class="toast" id="toastOut"></span>
          <button class="primary" id="btnCopyOut"><svg class="ic"><use href="#i-copy"/></svg>複製</button>
        </div>
      </div>
      <textarea id="output" readonly></textarea>
      <div class="stat" id="stat"></div>
    </div>
  </div>

  <!-- 選項 -->
  <div class="card opts" id="opts">
    <div class="full">
      <label for="keywords"><b>額外要遮蔽的關鍵字</b>（逗號分隔，例如公司名、主機名稱）</label>
      <input type="text" id="keywords" placeholder="例如：ACME, MY-PC, projectX">
    </div>
    <fieldset>
      <legend><svg class="ic"><use href="#i-gear"/></svg>要遮蔽的項目</legend>
      <label><input type="checkbox" id="optWin" checked> Windows 路徑</label>
      <label><input type="checkbox" id="optNix" checked> Linux / macOS 路徑</label>
      <label><input type="checkbox" id="optIp" checked> IP / MAC 位址</label>
      <label><input type="checkbox" id="optEmail" checked> Email</label>
      <label><input type="checkbox" id="optCred" checked> 帳號、密碼、Token</label>
      <label><input type="checkbox" id="maskUserAll" checked> 其他位置出現的使用者名稱</label>
    </fieldset>
    <fieldset>
      <legend>路徑取代方式</legend>
      <label><input type="radio" name="mode" value="structure" checked> 保留結構（逐段遮蔽）</label>
      <label><input type="radio" name="mode" value="keepName"> 只保留檔名</label>
      <label><input type="radio" name="mode" value="full"> 整段路徑取代</label>
    </fieldset>
    <fieldset>
      <legend>路徑選項</legend>
      <label><input type="checkbox" id="keepCommon" checked> 保留系統常見目錄（Users、AppData…）</label>
      <label><input type="checkbox" id="maskFile"> 遮蔽檔名（保留副檔名）</label>
      <label><input type="checkbox" id="keepDrive" checked> 保留磁碟代號</label>
      <label><input type="checkbox" id="allowSpace" checked> 目錄名稱可含空白</label>
    </fieldset>
    <fieldset>
      <legend>代號與其他</legend>
      <label><input type="checkbox" id="showType" checked> 代號顯示類型（如 [D-x7k2q]）</label>
      <label><input type="checkbox" id="keepLoopback" checked> 保留 127.0.0.1、::1 等本機位址</label>
      <label><input type="checkbox" id="maskOutName" checked> 下載的檔名也去識別化</label>
      <label><input type="checkbox" id="remember" checked> 在本機瀏覽器記住對照表</label>
      <div class="btns" style="margin-top:4px">
        <button id="btnRegen"><svg class="ic"><use href="#i-refresh"/></svg>重新產生所有代號</button>
        <span class="toast" id="toastRegen"></span>
      </div>
    </fieldset>
  </div>

  <!-- 批次檔案 -->
  <div class="card">
    <div class="panel-head"><h2><svg class="ic"><use href="#i-file"/></svg>批次處理檔案</h2>
      <div class="btns">
        <label class="hint" for="enc">編碼</label>
        <select id="enc">
          <option value="utf-8">UTF-8</option>
          <option value="big5">Big5</option>
          <option value="utf-16le">UTF-16 LE</option>
          <option value="shift_jis">Shift_JIS</option>
        </select>
        <button id="btnDlAll" disabled><svg class="ic"><use href="#i-download"/></svg>全部下載</button>
        <button id="btnMergeDl" disabled><svg class="ic"><use href="#i-merge"/></svg>合併下載</button>
        <button id="btnMergeCopy" disabled><svg class="ic"><use href="#i-copy"/></svg>合併複製</button>
        <button id="btnClearFiles" disabled><svg class="ic"><use href="#i-trash"/></svg>清除</button>
        <span class="toast" id="toastFiles"></span>
      </div>
    </div>
    <input type="file" id="fileInput" multiple hidden>
    <div class="drop" id="drop">
      <svg class="ic"><use href="#i-upload"/></svg>
      <div>把檔案拖曳到這裡，或點此選擇檔案（可多選）</div>
      <div class="hint">套用上方相同的選項與對照表；輸出一律為 UTF-8</div>
    </div>
    <div class="filetable"><table id="fileTable" hidden>
      <thead><tr><th>原始檔名</th><th>輸出檔名</th><th>大小</th><th>取代數</th><th></th></tr></thead>
      <tbody id="fileBody"></tbody>
    </table></div>
    <textarea id="filePreview" readonly hidden style="margin-top:10px;min-height:200px"></textarea>
  </div>

  <!-- 對照表 -->
  <div class="card">
    <details>
      <summary><svg class="ic"><use href="#i-table"/></svg>對照表（目前文字與檔案用到的代號）</summary>
      <div class="btns" style="margin:8px 0">
        <button id="btnCopyMap"><svg class="ic"><use href="#i-copy"/></svg>複製對照表 JSON</button>
        <button id="btnDlMap"><svg class="ic"><use href="#i-download"/></svg>下載對照表</button>
        <span class="toast" id="toastMap"></span>
      </div>
      <div class="maptable"><table><thead><tr><th>代號</th><th>原始內容</th></tr></thead><tbody id="mapBody"></tbody></table></div>
    </details>
  </div>

  <!-- 還原 -->
  <div class="card">
    <details>
      <summary><svg class="ic"><use href="#i-undo"/></svg>③ 還原 AI 回覆（把代號換回原始內容）</summary>
      <p class="hint">會使用本機記住的所有代號；若是在別台電腦或已清除，請把對照表 JSON 貼到「匯入對照表」。</p>
      <div class="grid">
        <div>
          <textarea id="aiReply" placeholder="貼上 AI 的回覆…" style="min-height:180px"></textarea>
          <textarea id="mapImport" placeholder="（選用）匯入對照表 JSON" style="min-height:70px;margin-top:8px"></textarea>
        </div>
        <div>
          <div class="btns" style="margin-bottom:6px">
            <button class="primary" id="btnRestore"><svg class="ic"><use href="#i-undo"/></svg>還原</button>
            <button id="btnCopyRestore"><svg class="ic"><use href="#i-copy"/></svg>複製</button>
            <span class="toast" id="toastRestore"></span>
          </div>
          <textarea id="restored" readonly style="min-height:180px"></textarea>
        </div>
      </div>
    </details>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const lc = s => (s || '').toLowerCase();
  const LS_CACHE = 'anonymizer.cache.v2';
  const LS_OPTS = 'anonymizer.opts.v2';

  const COMMON = new Set([
    // Windows
    'users','user','public','default','appdata','local','locallow','roaming','temp','tmp',
    'program files','program files (x86)','programdata','windows','system32','syswow64','desktop','documents',
    'downloads','pictures','music','videos','onedrive','microsoft',
    // Linux / macOS
    'home','usr','etc','var','opt','root','bin','sbin','lib','lib64','share','mnt','media','srv','proc','dev',
    'sys','run','include','applications','library','volumes','private','www','html',
    // 開發常見
    'src','obj','build','dist','node_modules','packages','debug','release','config','logs','log','cache',
    '.git','.vscode','.config','.cache','.local','scripts','test','tests'
  ]);
  const isUserParent = p => p === 'users' || p === 'home';

  /* ---------- 代號（隨機、同一原文固定同一代號） ---------- */
  const ALPHA = 'abcdefghijkmnpqrstuvwxyz23456789';   // 去掉易混淆的 l、o、0、1
  const cache = new Map();    // key -> {id, prefix, original}
  const ids = new Set();
  let opts = {};

  function randId() {
    const n = 5, out = [];
    let buf;
    try { buf = crypto.getRandomValues(new Uint32Array(n)); }
    catch { buf = Array.from({ length: n }, () => Math.floor(Math.random() * 1e9)); }
    for (let i = 0; i < n; i++) out.push(ALPHA[buf[i] % ALPHA.length]);
    return out.join('');
  }
  function entry(prefix, original) {
    const key = prefix + '|' + lc(original);
    let e = cache.get(key);
    if (!e) {
      let id; do { id = randId(); } while (ids.has(id));
      ids.add(id);
      e = { key, id, prefix, original };
      cache.set(key, e);
      cacheDirty = true;
    }
    return e;
  }
  const fmt = e => opts.showType ? `[${e.prefix}-${e.id}]` : `[${e.id}]`;
  function tok(prefix, original, ctx) {
    const e = entry(prefix, original);
    ctx.used.set(e.key, e);
    return fmt(e);
  }

  let cacheDirty = false;
  function saveCache() {
    if (!cacheDirty) return;
    cacheDirty = false;
    try {
      if (opts.remember) localStorage.setItem(LS_CACHE, JSON.stringify([...cache.values()]));
      else localStorage.removeItem(LS_CACHE);
    } catch (err) { console.warn('[anonymizer] 無法寫入 localStorage', err); }
  }
  function loadCache() {
    try {
      const arr = JSON.parse(localStorage.getItem(LS_CACHE) || '[]');
      for (const e of arr) { if (e && e.key && e.id) { cache.set(e.key, e); ids.add(e.id); } }
    } catch (err) { console.warn('[anonymizer] 對照表讀取失敗', err); }
  }

  /* ---------- 只替換「不是代號」的部分，避免重複遮蔽 ---------- */
  const TOKEN_SPLIT = /(\[(?:[A-Z]+-)?[a-z0-9]{5}\])/;
  function replaceOut(str, re, fn) {
    return str.split(TOKEN_SPLIT).map((part, i) => (i % 2 ? part : part.replace(re, fn))).join('');
  }
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  /* ---------- 正規表示式 ---------- */
  function buildPathRegex() {
    const ns = String.raw`[^\\/:*?"<>|\s]`;
    const sp = String.raw`[^\\/:*?"<>|\r\n]`;
    const win = String.raw`(?:\b[A-Za-z]:[\\/]|\\\\${ns}+[\\/])(?:${opts.allowSpace ? sp : ns}+[\\/])*${ns}*`;
    const nc = String.raw`[\p{L}\p{N}_.@+\-]`;
    const nix = String.raw`(?<![\p{L}\p{N}_:\/.\\~\-])(?:~\/(?:${nc}+\/)*${nc}+|\/(?:${nc}+\/)+${nc}*)`;
    const alts = [];
    if (opts.win) alts.push(`(?<win>${win})`);
    if (opts.nix) alts.push(`(?<nix>${nix})`);
    return alts.length ? new RegExp(alts.join('|'), 'gu') : null;
  }
  const RE_EMAIL = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;
  const RE_URLCRED = /\b([a-z][a-z0-9+.-]*:\/\/)([^\s:@\/]+):([^\s@\/]+)@/gi;
  const RE_KV = /\b(username|user|uid|login|account|acct|password|passwd|pwd|pass|access[_-]?token|token|api[_-]?key|apikey|client[_-]?secret|secret|auth)(\s*[:=]\s*)(["']?)([^\s"',;&]+)\3/gi;
  const RE_BEARER = /\b(Bearer|Basic)(\s+)([A-Za-z0-9._~+\/=-]{8,})/g;
  const RE_MAC = /(?<![0-9A-Fa-f:-])(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}(?![0-9A-Fa-f:-])/g;
  const OCT = '(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]?\\d)';
  const RE_IPV4 = new RegExp(`(?<![\\d.])(?:${OCT}\\.){3}${OCT}(?!\\d|\\.\\d)`, 'g');
  const H = '[0-9A-Fa-f]{1,4}';
  const RE_IPV6 = new RegExp(
    `(?<![\\w:])(?:(?:${H}:){7}${H}|(?:${H}:){1,6}:(?:${H}(?::${H}){0,5})?|::(?:${H}(?::${H}){0,6}))(?![\\w:])`, 'g');
  const USER_KEYS = new Set(['username', 'user', 'uid', 'login', 'account', 'acct']);
  const LOOPBACK = /^(127\.|0\.0\.0\.0$|255\.255\.255\.255$|::1?$)/;

  /* ---------- 路徑轉換 ---------- */
  function maskFileName(name, ctx) {
    if (!name || !opts.maskFile) return name;
    const i = name.lastIndexOf('.');
    return tok('F', name, ctx) + (i > 0 ? name.slice(i) : '');
  }
  function maskSeg(seg, prev, ctx) {
    if (!seg) return seg;
    if (isUserParent(lc(prev)) && !COMMON.has(lc(seg))) { ctx.users.add(seg); return tok('USER', seg, ctx); }
    if (opts.keepCommon && COMMON.has(lc(seg))) return seg;
    return tok('D', seg, ctx);
  }
  function transformPath(p, kind, ctx) {
    let head = '', rest = p, sep = '/';
    if (kind === 'win') {
      let m = p.match(/^([A-Za-z]:)([\\/])/);
      if (m) { head = (opts.keepDrive ? m[1] : 'X:') + m[2]; rest = p.slice(m[0].length); }
      else if ((m = p.match(/^\\\\([^\\/]+)([\\/])/))) { head = '\\\\' + tok('HOST', m[1], ctx) + m[2]; rest = p.slice(m[0].length); }
      sep = p.includes('\\') ? '\\' : '/';
    } else {
      head = p.startsWith('~/') ? '~/' : '/';
      rest = p.slice(head.length);
    }
    if (opts.mode === 'full') return tok('PATH', p, ctx);

    const parts = rest.split(/[\\/]/);
    const fileName = parts.pop();
    if (opts.mode === 'keepName') {
      return tok('DIR', p.slice(0, p.length - fileName.length), ctx) + maskFileName(fileName, ctx);
    }
    const out = parts.map((seg, i) => maskSeg(seg, parts[i - 1], ctx));
    let last = fileName;
    if (last) {
      const prev = lc(parts[parts.length - 1]);
      if (isUserParent(prev) && !COMMON.has(lc(last))) { ctx.users.add(last); last = tok('USER', last, ctx); }
      else if (!last.includes('.')) last = maskSeg(last, parts[parts.length - 1], ctx);  // 無副檔名視為目錄
      else last = maskFileName(last, ctx);
    }
    return head + out.concat([last]).join(sep);
  }

  /* ---------- 主流程 ---------- */
  function anonymize(text, used) {
    const ctx = { used, users: new Set() };
    const c = { path: 0, ip: 0, email: 0, cred: 0, user: 0, kw: 0 };
    if (!text) return { out: '', c };
    let s = text;

    // 預先收集使用者名稱
    const reUser = /[\\/](?:Users|home)[\\/]([^\\/:*?"<>|\r\n]+?)(?=[\\/]|\s|$)/gi;
    let um;
    while ((um = reUser.exec(text))) if (!COMMON.has(lc(um[1]))) ctx.users.add(um[1]);

    if (opts.cred) {
      s = replaceOut(s, RE_URLCRED, (m, sch, u, p) => { c.cred++; ctx.users.add(u); return sch + tok('USER', u, ctx) + ':' + tok('SECRET', p, ctx) + '@'; });
      s = replaceOut(s, RE_BEARER, (m, k, sp, v) => { c.cred++; return k + sp + tok('SECRET', v, ctx); });
      s = replaceOut(s, RE_KV, (m, k, sp, q, v) => {
        c.cred++;
        const isUser = USER_KEYS.has(lc(k));
        if (isUser && v.length >= 3) ctx.users.add(v);
        return k + sp + q + tok(isUser ? 'USER' : 'SECRET', v, ctx) + q;
      });
    }
    if (opts.email) s = replaceOut(s, RE_EMAIL, m => { c.email++; return tok('EMAIL', m, ctx); });
    if (opts.ip) {
      s = replaceOut(s, RE_MAC, m => { c.ip++; return tok('MAC', m, ctx); });
      s = replaceOut(s, RE_IPV4, m => (opts.keepLoopback && LOOPBACK.test(m)) ? m : (c.ip++, tok('IP', m, ctx)));
      s = replaceOut(s, RE_IPV6, m => (opts.keepLoopback && LOOPBACK.test(m)) ? m : (c.ip++, tok('IP', m, ctx)));
    }
    const rePath = buildPathRegex();
    if (rePath) {
      s = replaceOut(s, rePath, (...args) => {
        const raw = args[0];
        const g = args[args.length - 1];
        const mm = raw.match(/^(.*?)([.,;:)\]}'"`]*)$/s);
        const p = mm[1], tail = mm[2];
        if (!p || /^[A-Za-z]:$/.test(p)) return raw;
        c.path++;
        return transformPath(p, g.win !== undefined ? 'win' : 'nix', ctx) + tail;
      });
    }
    if (opts.maskUserAll) {
      [...ctx.users].sort((a, b) => b.length - a.length).forEach(u => {
        const re = new RegExp(`(?<![\\p{L}\\p{N}_])${escRe(u)}(?![\\p{L}\\p{N}_])`, 'giu');
        s = replaceOut(s, re, () => { c.user++; return tok('USER', u, ctx); });
      });
    }
    $('keywords').value.split(',').map(x => x.trim()).filter(Boolean)
      .sort((a, b) => b.length - a.length).forEach(k => {
        s = replaceOut(s, new RegExp(escRe(k), 'gi'), () => { c.kw++; return tok('KW', k, ctx); });
      });
    return { out: s, c };
  }

  function statText(c) {
    const names = { path: '路徑', ip: 'IP/MAC', email: 'Email', cred: '帳密', user: '使用者', kw: '關鍵字' };
    const parts = Object.keys(names).filter(k => c[k]).map(k => `${names[k]} ${c[k]}`);
    return parts.length ? parts.join('、') : '沒有找到要遮蔽的內容';
  }
  const total = c => Object.values(c).reduce((a, b) => a + b, 0);

  /* ---------- 選項 ---------- */
  const OPT_IDS = ['optWin', 'optNix', 'optIp', 'optEmail', 'optCred', 'maskUserAll', 'keepCommon', 'maskFile',
    'keepDrive', 'allowSpace', 'showType', 'keepLoopback', 'maskOutName', 'remember'];
  function readOpts() {
    opts = {
      win: $('optWin').checked, nix: $('optNix').checked, ip: $('optIp').checked, email: $('optEmail').checked,
      cred: $('optCred').checked, maskUserAll: $('maskUserAll').checked,
      mode: document.querySelector('input[name=mode]:checked').value,
      keepCommon: $('keepCommon').checked, maskFile: $('maskFile').checked, keepDrive: $('keepDrive').checked,
      allowSpace: $('allowSpace').checked, showType: $('showType').checked, keepLoopback: $('keepLoopback').checked,
      maskOutName: $('maskOutName').checked, remember: $('remember').checked,
    };
  }
  function saveOpts() {
    try {
      const o = { mode: opts.mode, keywords: $('keywords').value, enc: $('enc').value };
      OPT_IDS.forEach(id => (o[id] = $(id).checked));
      localStorage.setItem(LS_OPTS, JSON.stringify(o));
    } catch { /* 無法使用 localStorage 時忽略 */ }
  }
  function loadOpts() {
    try {
      const o = JSON.parse(localStorage.getItem(LS_OPTS) || 'null');
      if (!o) return;
      OPT_IDS.forEach(id => { if (typeof o[id] === 'boolean') $(id).checked = o[id]; });
      const r = document.querySelector(`input[name=mode][value="${o.mode}"]`); if (r) r.checked = true;
      if (typeof o.keywords === 'string') $('keywords').value = o.keywords;
      if (o.enc) $('enc').value = o.enc;
    } catch { /* 忽略 */ }
  }

  /* ---------- 檔案 ---------- */
  let files = [];             // {file, name, size, raw, out, c, outName, binary, error}
  let usedText = new Map(), usedFiles = new Map();

  function outFileName(name, ctx) {
    const i = name.lastIndexOf('.');
    const base = i > 0 ? name.slice(0, i) : name, ext = i > 0 ? name.slice(i) : '';
    if (!opts.maskOutName) return `${base}.anon${ext}`;
    const e = entry('F', name); ctx.set(e.key, e);
    return (opts.showType ? `F-${e.id}` : e.id) + ext;
  }
  function readFile(f, enc) {
    return new Promise(resolve => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => resolve(null);
      r.readAsText(f, enc);
    });
  }
  async function addFiles(list) {
    const enc = $('enc').value;
    for (const f of list) {
      const item = { file: f, name: f.name, size: f.size };
      const text = await readFile(f, enc);
      if (text === null) item.error = '讀取失敗';
      else if (/\u0000/.test(text.slice(0, 8000))) item.binary = true;
      else item.raw = text;
      files.push(item);
    }
    processFiles();
  }
  async function rereadAll() {
    const enc = $('enc').value;
    for (const it of files) {
      const text = await readFile(it.file, enc);
      it.error = it.binary = undefined; it.raw = undefined;
      if (text === null) it.error = '讀取失敗';
      else if (/\u0000/.test(text.slice(0, 8000))) it.binary = true;
      else it.raw = text;
    }
    processFiles();
  }
  function processFiles() {
    usedFiles = new Map();
    for (const it of files) {
      if (it.raw === undefined) continue;
      const r = anonymize(it.raw, usedFiles);
      it.out = r.out; it.c = r.c;
      it.outName = outFileName(it.name, usedFiles);
    }
    renderFiles(); renderMap(); saveCache();
  }
  const fmtSize = n => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`;
  function iconBtn(icon, text, onClick) {
    const b = document.createElement('button');
    b.innerHTML = `<svg class="ic"><use href="#${icon}"/></svg>${text}`;
    b.onclick = onClick; return b;
  }
  function renderFiles() {
    const tb = $('fileBody'); tb.innerHTML = '';
    $('fileTable').hidden = !files.length;
    const ok = files.some(f => f.out !== undefined);
    ['btnDlAll', 'btnMergeDl', 'btnMergeCopy'].forEach(id => ($(id).disabled = !ok));
    $('btnClearFiles').disabled = !files.length;
    if (!files.length) $('filePreview').hidden = true;
    files.forEach((it, idx) => {
      const tr = document.createElement('tr');
      const td = (t, cls) => { const d = document.createElement('td'); d.textContent = t; if (cls) d.className = cls; return d; };
      tr.append(td(it.name, 'mono'));
      if (it.out === undefined) {
        const msg = it.binary ? '略過（看起來是二進位檔）' : (it.error || '');
        const d = td(msg, 'warn'); d.colSpan = 4; tr.append(td('—'), td(fmtSize(it.size)), d);
      } else {
        tr.append(td(it.outName, 'mono'), td(fmtSize(it.size)));
        const cnt = td(String(total(it.c))); cnt.title = statText(it.c); tr.append(cnt);
        const act = document.createElement('td');
        const box = document.createElement('div'); box.className = 'btns';
        box.append(
          iconBtn('i-eye', '預覽', () => { const p = $('filePreview'); p.hidden = false; p.value = it.out; p.scrollIntoView({ block: 'nearest' }); }),
          iconBtn('i-download', '下載', () => download(it.outName, it.out)),
          iconBtn('i-trash', '', () => { files.splice(idx, 1); processFiles(); })
        );
        act.append(box); tr.append(act);
      }
      tb.append(tr);
    });
  }
  function mergedText() {
    return files.filter(f => f.out !== undefined)
      .map(f => `===== ${f.outName} =====\n${f.out}`).join('\n\n');
  }
  function download(name, text) {
    try {
      const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (err) { console.error('[anonymizer] 下載失敗', err); flash('toastFiles', '下載失敗'); }
  }

  /* ---------- 文字區 ---------- */
  function processText() {
    usedText = new Map();
    const r = anonymize($('input').value, usedText);
    $('output').value = r.out;
    $('stat').textContent = $('input').value ? statText(r.c) : '';
    renderMap(); saveCache();
  }
  function processAll() { readOpts(); saveOpts(); processText(); processFiles(); }

  function usedAll() { return new Map([...usedText, ...usedFiles]); }
  function renderMap() {
    const tb = $('mapBody'); tb.innerHTML = '';
    for (const e of usedAll().values()) {
      const tr = document.createElement('tr');
      const a = document.createElement('td'); a.textContent = fmt(e);
      const b = document.createElement('td'); b.textContent = e.original;
      tr.append(a, b); tb.append(tr);
    }
  }
  function mapObject(entries) { const o = {}; for (const e of entries) o[fmt(e)] = e.original; return o; }

  async function copy(text, toastId) {
    try { await navigator.clipboard.writeText(text); flash(toastId, '已複製'); }
    catch { flash(toastId, '複製失敗，請手動選取'); }
  }
  function flash(id, msg) { const el = $(id); el.textContent = msg; clearTimeout(el._t); el._t = setTimeout(() => (el.textContent = ''), 1600); }

  function restore() {
    // 兩種格式都還原（有類型 / 無類型），避免切換選項後無法還原
    const dict = {};
    for (const e of cache.values()) { dict[`[${e.prefix}-${e.id}]`] = e.original; dict[`[${e.id}]`] = e.original; if (e.prefix === 'F') { dict[`F-${e.id}`] = e.original; } }
    const imp = $('mapImport').value.trim();
    if (imp) {
      try { Object.assign(dict, JSON.parse(imp)); }
      catch (err) { $('restored').value = '對照表 JSON 格式錯誤：' + err.message; return; }
    }
    let s = $('aiReply').value;
    Object.keys(dict).sort((a, b) => b.length - a.length).forEach(t => { s = s.split(t).join(dict[t]); });
    $('restored').value = s;
  }

  const SAMPLE = String.raw`Error: ENOENT: no such file or directory, open 'C:\Users\WangXiaoMing\Documents\ACME\project-x\src\config.json'
    at Object.openSync (node:fs:601:3)
專案位置：D:\Work\ACME 客戶\報價系統\main.go
輸出到 \\MY-PC\share\backup\2026\db.bak
使用者 WangXiaoMing 的暫存檔：C:/Users/WangXiaoMing/AppData/Local/Temp/tmp123.log.
連線 192.168.1.23:5432 失敗，本機 127.0.0.1 正常，網卡 00:1A:2B:3C:4D:5E
DB_URL=postgres://admin:S3cr3t!@10.0.0.5/app
password="hunter2" token=abc123xyz
Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.payload.sig
聯絡 wang.xm@acme.com.tw
Linux 主機：/home/wangxm/projects/acme-api/server.py 與 ~/notes/todo.md`;

  /* ---------- 事件 ---------- */
  let tInput;
  $('input').addEventListener('input', () => { clearTimeout(tInput); tInput = setTimeout(() => { readOpts(); processText(); }, 120); });
  $('keywords').addEventListener('input', () => { clearTimeout(tInput); tInput = setTimeout(processAll, 250); });
  $('opts').querySelectorAll('input').forEach(el => el.addEventListener('change', () => {
    if (el.id === 'remember') cacheDirty = true;
    processAll();
  }));
  $('btnSample').onclick = () => { $('input').value = SAMPLE; if (!$('keywords').value) $('keywords').value = 'ACME, MY-PC'; processAll(); };
  $('btnClear').onclick = () => { $('input').value = ''; processAll(); };
  $('btnCopyOut').onclick = () => copy($('output').value, 'toastOut');
  $('btnRegen').onclick = () => { cache.clear(); ids.clear(); cacheDirty = true; processAll(); flash('toastRegen', '已重新產生'); };

  $('drop').onclick = () => $('fileInput').click();
  $('fileInput').onchange = e => { readOpts(); addFiles([...e.target.files]); e.target.value = ''; };
  ['dragenter', 'dragover'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
  $('drop').addEventListener('drop', e => { readOpts(); addFiles([...e.dataTransfer.files]); });
  $('enc').onchange = () => { saveOpts(); readOpts(); rereadAll(); };
  $('btnDlAll').onclick = async () => {
    for (const it of files.filter(f => f.out !== undefined)) { download(it.outName, it.out); await new Promise(r => setTimeout(r, 300)); }
  };
  $('btnMergeDl').onclick = () => download(opts.maskOutName ? 'merged.anon.txt' : 'merged.anon.txt', mergedText());
  $('btnMergeCopy').onclick = () => copy(mergedText(), 'toastFiles');
  $('btnClearFiles').onclick = () => { files = []; processFiles(); };

  $('btnCopyMap').onclick = () => copy(JSON.stringify(mapObject(usedAll().values()), null, 2), 'toastMap');
  $('btnDlMap').onclick = () => download('anonymizer-map.json', JSON.stringify(mapObject(usedAll().values()), null, 2));
  $('btnRestore').onclick = restore;
  $('btnCopyRestore').onclick = () => copy($('restored').value, 'toastRestore');

  // 初始化
  loadOpts(); readOpts(); loadCache(); processAll();
})();
</script>
